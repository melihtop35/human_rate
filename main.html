<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İnsan FC Kartı Jeneratörü</title>
    <style>
      :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --primary: #d4af37;
        --text-light: #f5f5f5;
        --text-muted: #a0a0a0;
        --border-radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-light);
        padding-bottom: 40px;
      }

      header {
        position: sticky;
        top: 0;
        background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        border-bottom: 2px solid var(--primary);
        padding: 20px;
        text-align: center;
        z-index: 100;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-light);
      }

      .ovr-badge {
        background: var(--primary);
        color: #000;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 1.5rem;
        font-weight: 900;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      }

      .container {
        padding: 15px;
        max-width: 600px;
        margin: 0 auto;
      }

      .category-card {
        background-color: var(--card-bg);
        border-radius: var(--border-radius);
        margin-bottom: 20px;
        overflow: hidden;
        border: 1px solid #333;
      }

      .category-header {
        background: #2a2a2a;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #444;
      }

      .category-title {
        font-size: 1.1rem;
        font-weight: bold;
        color: var(--primary);
      }

      .category-score {
        font-size: 1.3rem;
        font-weight: 800;
      }

      .stat-item {
        padding: 15px;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .stat-item:last-child {
        border-bottom: none;
      }

      .stat-info {
        flex: 1;
        padding-right: 15px;
      }

      .stat-name {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .stat-desc {
        font-size: 0.75rem;
        color: var(--text-muted);
        line-height: 1.3;
      }

      .stat-input {
        width: 70px;
        background-color: #333;
        border: 1px solid #555;
        color: var(--text-light);
        border-radius: 6px;
        padding: 10px;
        font-size: 1.1rem;
        text-align: center;
        font-weight: bold;
      }

      .stat-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      .loading-text {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
      }

      /* Kart Jeneratörü Özel Stilleri */
      .canvas-container {
        position: relative;
        width: 300px;
        aspect-ratio: 644 / 894;
        margin: 20px auto;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      }

      #cardCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .btn-download {
        background: var(--primary);
        color: #000;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
      }

      .file-input-wrapper {
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-title">İnsan FC Statları</div>
      <div class="ovr-badge">OVR <span id="main-ovr">0</span></div>
    </header>

    <div class="container">
      <!-- Kart Jeneratörü Arayüzü -->
      <div class="category-card">
        <div class="category-header">
          <div class="category-title">FC Kartı Oluşturucu</div>
        </div>
        <div style="padding: 15px; text-align: center">
          <input
            type="text"
            id="playerName"
            placeholder="Sahadaki Adın (Örn: Berkan)"
            class="stat-input"
            style="width: 100%; text-align: left"
          />

          <div class="file-input-wrapper">
            <label
              style="
                display: block;
                margin-bottom: 5px;
                color: var(--text-muted);
                font-size: 0.9rem;
              "
              >Fotoğraf Çek / Yükle:</label
            >
            <input
              type="file"
              id="playerImage"
              accept="image/*"
              capture="user"
              style="color: #fff; width: 100%"
            />
          </div>

          <div class="canvas-container">
            <canvas id="cardCanvas" width="644" height="894"></canvas>
          </div>

          <button class="btn-download" onclick="downloadCard()">
            Instagram Story İçin İndir 📸
          </button>
        </div>
      </div>

      <!-- Statların Yükleneceği Alan -->
      <div id="app">
        <div class="loading-text">Veriler yükleniyor...</div>
      </div>
    </div>

    <script>
      let statsData = [];
      const appContainer = document.getElementById("app");

      // İndirilen gerçek fut.gg kartları (ratings/ klasöründen, yerel)
      const cardBgUrls = {
        bronzeNormal: "ratings/0_bronze.png",
        bronzeRare: "ratings/1_bronze.png",
        silverNormal: "ratings/0_silver.png",
        silverRare: "ratings/1_silver.png",
        goldNormal: "ratings/0_gold.png",
        goldRare: "ratings/1_gold.png",
        heroes: "ratings/72_heroes.png",
        icon: "ratings/12_icon.png",
        toty: "ratings/5_toty.png",
        futties: "ratings/16_futties.png",
      };

      // OVR (1-100) değerine göre hangi kart görselinin kullanılacağını belirler
      function cardKeyForOvr(ovr) {
        if (ovr >= 98) return "futties";
        if (ovr >= 94) return "toty";
        if (ovr >= 90) return "icon";
        if (ovr >= 85) return "heroes";
        if (ovr >= 82) return "goldRare";
        if (ovr >= 75) return "goldNormal";
        if (ovr >= 70) return "silverRare";
        if (ovr >= 65) return "silverNormal";
        if (ovr >= 59) return "bronzeRare";
        return "bronzeNormal";
      }

      let uploadedImage = null;

      // Fotoğraf yükleme dinleyicisi
      document
        .getElementById("playerImage")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (event) {
              const img = new Image();
              img.onload = function () {
                uploadedImage = img;
                renderCard();
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          }
        });

      // İsim girişini anlık karta yansıtma
      document
        .getElementById("playerName")
        .addEventListener("input", renderCard);

      // JSON Çekme
      fetch("data.json")
        .then((response) => {
          if (!response.ok) throw new Error("JSON dosyası yüklenemedi.");
          return response.json();
        })
        .then((data) => {
          statsData = data;
          appContainer.innerHTML = "";
          renderApp();
          renderCard(); // İlk yüklemede boş kartı çiz
        })
        .catch((error) => {
          appContainer.innerHTML = `<div class="loading-text" style="color: #ff4444;">Hata: data.json dosyası okunamadı.</div>`;
        });

      function renderApp() {
        statsData.forEach((category) => {
          const card = document.createElement("div");
          card.className = "category-card";
          card.dataset.category = category.id;

          const header = document.createElement("div");
          header.className = "category-header";
          header.innerHTML = `
                    <div class="category-title">${category.title} (${category.id})</div>
                    <div class="category-score" id="score-${category.id}">0</div>
                `;
          card.appendChild(header);

          category.items.forEach((item) => {
            const statRow = document.createElement("div");
            statRow.className = "stat-item";

            statRow.innerHTML = `
                        <div class="stat-info">
                            <div class="stat-name">${item.name}</div>
                            <div class="stat-desc">${item.desc}</div>
                        </div>
                        <input type="number" class="stat-input" data-category="${category.id}" min="1" max="10" step="0.1" placeholder="0.0">
                    `;
            card.appendChild(statRow);
          });

          appContainer.appendChild(card);
        });

        document.querySelectorAll(".stat-input").forEach((input) => {
          input.addEventListener("input", () => {
            calculateScores();
            renderCard(); // Puan değiştikçe kartı tekrar oluştur
          });
          input.addEventListener("blur", function () {
            let val = parseFloat(this.value);
            if (val > 10) this.value = 10;
            if (val < 1 && this.value !== "") this.value = 1;
          });
        });
      }

      function calculateScores() {
        let totalOvrSum = 0;
        let activeCategories = 0;

        statsData.forEach((category) => {
          const inputs = document.querySelectorAll(
            `.stat-input[data-category="${category.id}"]`,
          );
          let categorySum = 0;
          let itemCount = inputs.length;

          inputs.forEach((input) => {
            let val = parseFloat(input.value) || 0;
            if (val > 10) val = 10;
            categorySum += val;
          });

          let categoryAverage = categorySum / itemCount;
          let categoryScoreInt = Math.round(categoryAverage * 10);

          document.getElementById(`score-${category.id}`).innerText =
            categoryScoreInt;

          totalOvrSum += categoryScoreInt;
          activeCategories++;
        });

        let finalOvr = 0;
        if (activeCategories > 0) {
          finalOvr = Math.round(totalOvrSum / activeCategories);
        }

        document.getElementById("main-ovr").innerText = finalOvr;
      }

      // Kart Render Motoru
      const CARD_W = 644;
      const CARD_H = 894;

      function renderCard() {
        const canvas = document.getElementById("cardCanvas");
        const ctx = canvas.getContext("2d");
        const ovr =
          parseInt(document.getElementById("main-ovr").innerText) || 0;

        // OVR değerine göre Kart Klasmanı Belirleme
        const bgType = cardKeyForOvr(ovr);

        const bgImg = new Image();

        bgImg.onload = function () {
          ctx.clearRect(0, 0, CARD_W, CARD_H);

          // 1) ÖNCE KARTIN KENDİ TASARIMINI ÇİZ (Arka plan olarak)
          ctx.drawImage(bgImg, 0, 0, CARD_W, CARD_H);

          // 2) SONRA FOTOĞRAFI ÜZERİNE ÇİZ (Daire maskeyle)
          if (uploadedImage) {
            const photoCx = CARD_W * 0.5;
            const photoCy = CARD_H * 0.315;
            const photoR = CARD_W * 0.225;

            ctx.save();
            ctx.beginPath();
            ctx.arc(photoCx, photoCy, photoR, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            // Fotoğrafı kırpma alanını tam kaplayacak şekilde ölçekle
            const imgRatio = uploadedImage.width / uploadedImage.height;
            let drawW = photoR * 2;
            let drawH = photoR * 2;
            if (imgRatio > 1) {
              drawW = drawH * imgRatio;
            } else {
              drawH = drawW / imgRatio;
            }
            ctx.drawImage(
              uploadedImage,
              photoCx - drawW / 2,
              photoCy - drawH / 2,
              drawW,
              drawH,
            );
            ctx.restore();
          }

          // 3) Kart tipine göre normal yazı rengi
          const lightTextCards = ["toty", "icon", "heroes", "futties"];
          let textColor = "#1a1a1a";
          if (lightTextCards.includes(bgType)) textColor = "#f5f5f5";
          if (bgType === "goldNormal" || bgType === "goldRare")
            textColor = "#4a3c10";
          ctx.fillStyle = textColor;

          // 4) OVR — DİNAMİK INVERT EFEKTİ
          ctx.save();
          // Beyaz dolgu ve difference modu sayesinde arka planın tam zıttı renk oluşur
          ctx.fillStyle = "#FFFFFF";
          ctx.globalCompositeOperation = "difference";
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";
          ctx.font = `bold ${Math.round(CARD_W * 0.12)}px 'Segoe UI'`;
          ctx.fillText(String(ovr), CARD_W * 0.12, CARD_H * 0.275);
          ctx.restore();

          // 5) Pozisyon — OVR'ın hemen altında
          ctx.font = `bold ${Math.round(CARD_W * 0.05)}px 'Segoe UI'`;
          ctx.fillText("", CARD_W * 0.12, CARD_H * 0.2);

          // 6) İsim — fotoğrafın altındaki ayraç çizgisinin hemen üstü, ortalı
          const pName = document.getElementById("playerName").value || "OYUNCU";
          ctx.textAlign = "center";
          let nameFontSize = Math.round(CARD_W * 0.062);
          ctx.font = `bold ${nameFontSize}px 'Segoe UI'`;
          const maxNameWidth = CARD_W * 0.86;
          while (
            ctx.measureText(pName.toUpperCase()).width > maxNameWidth &&
            nameFontSize > 14
          ) {
            nameFontSize -= 2;
            ctx.font = `bold ${nameFontSize}px 'Segoe UI'`;
          }
          ctx.fillText(pName.toUpperCase(), CARD_W * 0.5, CARD_H * 0.592);

          // 7) İnce ayraç çizgisi
          ctx.save();
          ctx.globalAlpha = 0.35;
          ctx.strokeStyle = textColor;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(CARD_W * 0.18, CARD_H * 0.625);
          ctx.lineTo(CARD_W * 0.82, CARD_H * 0.625);
          ctx.stroke();
          ctx.restore();

          // 8) Statlar
          const statFontSize = Math.round(CARD_W * 0.065);
          ctx.font = `bold ${statFontSize}px 'Segoe UI'`;
          ctx.textAlign = "center";

          const catScores = [];
          if (statsData.length > 0) {
            statsData.forEach((cat) => {
              const score = document.getElementById(`score-${cat.id}`)
                ? document.getElementById(`score-${cat.id}`).innerText
                : "0";
              catScores.push({ id: cat.id, score: score });
            });

            const leftValueX = CARD_W * 0.205;
            const leftLabelX = CARD_W * 0.275;

            const rightValueX = CARD_W * 0.585;
            const rightLabelX = CARD_W * 0.655;
            const rowYs = [CARD_H * 0.682, CARD_H * 0.736, CARD_H * 0.79];
            ctx.textBaseline = "middle";

            for (let i = 0; i < 3; i++) {
              if (catScores[i]) {
                ctx.textAlign = "right";
                ctx.fillText(String(catScores[i].score), leftValueX, rowYs[i]);
                ctx.textAlign = "left";
                ctx.fillText(catScores[i].id, leftLabelX, rowYs[i]);
              }

              if (catScores[i + 3]) {
                ctx.textAlign = "right";
                ctx.fillText(
                  String(catScores[i + 3].score),
                  rightValueX,
                  rowYs[i],
                );
                ctx.textAlign = "left";
                ctx.fillText(catScores[i + 3].id, rightLabelX, rowYs[i]);
              }
            }
          }
        };

        bgImg.onerror = function () {
          ctx.fillStyle = "#222";
          ctx.fillRect(0, 0, CARD_W, CARD_H);
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.font = "bold 22px Arial";
          ctx.fillText("Görsel bulunamadı:", CARD_W / 2, CARD_H * 0.45);
          ctx.font = "18px Arial";
          ctx.fillText(cardBgUrls[bgType], CARD_W / 2, CARD_H * 0.48);
          ctx.fillText(
            "ratings/ klasörünü kontrol et.",
            CARD_W / 2,
            CARD_H * 0.51,
          );
        };

        bgImg.src = cardBgUrls[bgType];
      }

      function downloadCard() {
        const canvas = document.getElementById("cardCanvas");
        try {
          const dataUrl = canvas.toDataURL("image/png");
          const link = document.createElement("a");
          link.download = "fc_karti.png";
          link.href = dataUrl;
          link.click();
        } catch (e) {
          alert(
            "İndirme başarısız oldu. ratings/ klasöründeki görsellerin bu HTML dosyasıyla aynı sunucudan (local server) servis edildiğinden emin ol — dosya:// ile doğrudan açmak sorun çıkarabilir.",
          );
        }
      }
    </script>
  </body>
</html>
